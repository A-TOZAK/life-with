<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>研究ノート（限定公開）｜LiFE with</title>
<style>
:root { --ink:#15181c; --paper:#fff; --wash:#f6f6f4; --line:#e6e6e3; --sub:#767b83; --accent:#2b5fd9; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif; color:var(--ink); background:var(--paper); line-height:2; font-feature-settings:"palt"; }
.gate { max-width:460px; margin:16vh auto 0; padding:0 24px; text-align:center; }
.gate h1 { font-size:20px; margin-bottom:8px; }
.gate p { font-size:13.5px; color:var(--sub); margin-bottom:22px; }
.gate input { width:100%; padding:13px 16px; font-size:16px; border:1px solid var(--line); font-family:inherit; }
.gate button { width:100%; margin-top:10px; padding:13px; font-size:15px; font-weight:700; background:var(--ink); color:#fff; border:none; cursor:pointer; font-family:inherit; }
.gate button:hover { background:var(--accent); }
.gate .err { color:#b3543c; font-size:13px; margin-top:10px; min-height:1.5em; }
#content { display:none; max-width:780px; margin:0 auto; padding:48px 24px 90px; }
#content .kicker { font-size:12px; letter-spacing:.18em; color:var(--sub); font-weight:600; }
#content h1 { font-size:26px; line-height:1.6; margin:8px 0 14px; }
#content h2 { font-size:19px; margin:44px 0 10px; padding-top:18px; border-top:1px solid var(--line); }
#content .lead { background:var(--wash); padding:18px 22px; font-size:15px; }
#content ol, #content ul { margin:10px 0 10px 1.4em; }
#content li { margin:6px 0; font-size:15px; }
#content ul.refs li { font-size:13.5px; }
#content a { color:var(--accent); text-decoration:none; }
#content a:hover { text-decoration:underline; }
#content .dlbox { border:2px solid var(--ink); padding:16px 20px; font-size:16px; font-weight:700; margin:14px 0; }
#content ul.files { list-style:none; margin-left:0; }
#content ul.files li { padding-left:1.3em; text-indent:-1.3em; font-size:14px; }
#content ul.files li::before { content:"・"; }
#content .foot { color:var(--sub); font-size:12.5px; margin-top:40px; border-top:1px solid var(--line); padding-top:14px; }
</style>
</head>
<body>

  <button onclick="unlock()">開く</button>
  <div class="err" id="err"></div>
</div>

function b64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function unlock(){
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err");
  err.textContent = "";
  try {
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name:"PBKDF2", salt:b64(P.salt), iterations:200000, hash:"SHA-256" },
      km, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(P.iv) }, key, b64(P.ct));
    document.getElementById("content").innerHTML = new TextDecoder().decode(plain);
    document.getElementById("content").style.display = "block";
    document.getElementById("gate").style.display = "none";
  } catch(e) {
    err.textContent = "パスワードが違うようです。";
  }
}
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });

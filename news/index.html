<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>お知らせ ── LiFE with</title>
<meta name="description" content="LiFE withのお知らせ一覧。研修・登壇・教材公開の記録です。">
<meta name="robots" content="index,follow">
<link rel="icon" href="../assets/logo_icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff; --paper2:#f4f5f7; --ink:#2f3236; --sub:#6b7076;
    --ai:#1866b2; --ai2:#12518f; --sora:#eaf1f9; --sora2:#f2f7fc;
    --mizu:#b9d1e8; --karashi:#6f94bd; --line:#e7e9ec; --max:860px;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
        color:var(--ink); background:var(--paper); line-height:1.95; font-size:17px;
        -webkit-font-smoothing:antialiased; }
  img{ max-width:100%; display:block; }
  .wrap{ max-width:var(--max); margin:0 auto; padding:0 24px; }
  header{ position:sticky; top:0; z-index:100; background:rgba(255,255,255,.93);
          backdrop-filter:blur(6px); border-bottom:1px solid rgba(231,233,236,.9); }
  .hd{ max-width:var(--max); margin:0 auto; padding:0 24px; height:70px;
       display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .brand img{ height:48px; width:auto; }
  .back{ font-size:14.5px; color:#454a50; text-decoration:none; }
  .back:hover{ color:var(--ink); }
  main{ padding:64px 0 80px; }
  .kick{ font-family:"Zen Maru Gothic",sans-serif; font-size:13.5px; letter-spacing:.3em;
         color:var(--ai); font-weight:700; }
  .kick::after{ content:""; display:inline-block; width:26px; height:2px; border-radius:2px;
                background:var(--mizu); vertical-align:middle; margin-left:12px; }
  h1{ font-family:"Zen Maru Gothic",sans-serif; font-weight:700;
      font-size:clamp(26px,3.4vw,38px); letter-spacing:.04em; line-height:1.65; margin-top:4px; }
  .news-list{ background:#fff; border:1px solid var(--line); border-radius:18px;
              overflow:hidden; margin-top:30px; }
  .nw{ display:flex; align-items:baseline; gap:14px; padding:18px 24px;
       border-top:1px dashed var(--line); text-decoration:none; color:inherit; }
  .nw:first-child{ border-top:none; }
  a.nw:hover{ background:var(--sora2); }
  .nw .d{ font-family:"Zen Maru Gothic",sans-serif; font-weight:700; font-size:13.5px;
          color:var(--sub); min-width:92px; }
  .nw .t{ flex:1; font-size:15.5px; line-height:1.85; }
  .tag{ display:inline-block; border-radius:999px; font-size:12px; padding:3px 13px;
        font-weight:700; letter-spacing:.06em; white-space:nowrap; align-self:center;
        background:var(--sora); color:var(--ai); }
  .note{ font-size:13.5px; color:var(--sub); line-height:1.9; margin-top:14px; }
  footer{ padding:36px 0 40px; }
  .fc{ font-size:12.5px; color:var(--sub); border-top:1px solid var(--line); padding-top:24px; line-height:1.9; }
  @media (max-width:900px){
    .nw{ flex-wrap:wrap; gap:8px 14px; }
    .nw .t{ flex-basis:100%; order:3; }
  }
</style>
</head>
<body>

<header>
  <div class="hd">
    <a class="brand" href="../" aria-label="LiFE with トップへ">
      <img src="../assets/logo.png" alt="LiFE with">
    </a>
    <a class="back" href="../">← トップへ戻る</a>
  </div>
</header>

<main>
  <div class="wrap">
    <span class="kick">News</span>
    <h1>お知らせ</h1>
    <div class="news-list" id="news-list"></div>
    <p class="note">学校名・主催者名は、掲載のご了解をいただいたものから順に記載しています。</p>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="fc">本サイトは個人の活動として運営しており、所属する学校・自治体の公式見解を示すものではありません。<br>© LiFE with（外﨑顯博）</div>
  </div>
</footer>

<script src="../data.js"></script>
<script>
(function(){
  var nl = document.getElementById('news-list');
  if (!nl || !window.LW_NEWS) return;
  nl.innerHTML = window.LW_NEWS.map(function(n){
    var href = n.href;
    if (href && href.indexOf('http') !== 0) href = '../' + href;
    var inner = '<span class="d">' + n.d + '</span><span class="tag">' + n.tag + '</span>' +
                '<span class="t">' + n.t + '</span>';
    return href
      ? '<a class="nw" href="' + href + '"' + (href.indexOf('http')===0 ? ' target="_blank" rel="noopener"' : '') + '>' + inner + '</a>'
      : '<div class="nw">' + inner + '</div>';
  }).join('');
})();
</script>
</body>
</html>
